[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trustrag-guard"
version = "0.1.0"
description = "Research prototype: poisoning-detection middleware between a RAG retriever and the generator"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fidal Govind" }, { name = "Lubaba Sadiya" }]
# Lower bounds are the versions this code was tested with (requirements.txt holds the
# full environment); upper bounds stop at the next major version.
dependencies = [
    "numpy>=2.5.3,<3",
    "scikit-learn>=1.9.1,<2",
    "threadpoolctl>=3.7.0,<4",
    "numba>=0.68.1,<1",
    "sentence-transformers>=6.1.0,<7",
    "chromadb>=1.5.9,<2",
    "langchain-core>=1.7.6,<2",
    "pydantic>=2.14.3,<3",
    "joblib>=1.6.0,<2",
    "httpx>=0.28.1,<1",
]

[project.optional-dependencies]
# tests/test_text_space.py cross-checks ROUGE-L against rouge_score.
test = ["rouge_score>=0.1.2"]

[tool.setuptools.packages.find]
include = ["trustrag_guard*"]

[tool.setuptools.package-data]
"trustrag_guard.calibration" = ["reference_thresholds.json"]
